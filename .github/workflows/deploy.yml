name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One in-flight deploy at a time; let a newer push finish rather than queueing.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: 'true'
      # Served from the root of the custom domain (www.bestnamkeen.com), so no
      # base path. Without a custom domain this would be /<repo name>.
      NEXT_PUBLIC_BASE_PATH: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static export
        run: npm run build

      # `_next/` starts with an underscore, which Jekyll would strip.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
